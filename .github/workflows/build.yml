name: build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run daily at midnight to ensure we catch regressions.
    - cron: "0 0 * * *"
  # Allow manual triggering of the workflow.
  # https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        bazel_version: [8.x]

    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mount bazel cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ matrix.bazel_version }}-${{ hashFiles('**/*.bazel*', '**/*.bzl') }}
          restore-keys: |
            bazel-${{ matrix.bazel_version }}-

      - name: Save start time
        run: echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build
        run: bazel build --test_output=errors //...
      - name: Test
        run: bazel test --test_output=errors //...

      - name: Calculate build duration
        if: always()
        run: echo "duration=$(( $(date +%s) - START_TIME ))" >> "$GITHUB_ENV"

      - name: Compress cache
        if: always()
        run: rm -rf $(bazel info repository_cache)

      - name: Save bazel cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        # Only create a new cache entry if we're on the main branch or the build takes >5mins.
        #
        # NOTE: Even though `always()` evaluates to true, and `true && x == x`, the `always() &&`
        # prefix is not redundant! The call to `always()` has a side effect, which is to override
        # the default behavior of automagically canceling this step if a previous step failed.
        # (Don't blame me, blame GitHub Actions!)
        if: always() && (github.ref_name == 'main' || env.duration > 300)
        with:
          path: "~/.cache/bazel"
          key: bazel-${{ matrix.bazel_version }}-${{ hashFiles('**/*.bazel*', '**/*.bzl') }}-${{ github.run_id }}

  oss-exit-gate-release:
    name: Publish GitHub Release via OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Stage release artifacts and upload manifest to OSS Exit Gate
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE="thinkit-${VERSION}.tar.gz"
          git archive --format=tar.gz -o "$ARCHIVE" HEAD
          if gcloud artifacts versions describe "${TAG_NAME}" \
            --package="thinkit" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="thinkit--githubreleases" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${TAG_NAME}" \
              --package="thinkit" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="thinkit--githubreleases" \
              --quiet
          fi
          gcloud artifacts generic upload \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="thinkit--githubreleases" \
            --package="thinkit" \
            --version="${TAG_NAME}" \
            --source="$ARCHIVE"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "thinkit",
                    "version": "${TAG_NAME}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/thinkit/githubreleases/manifests/manifest-${TAG_NAME}-${RUN_ID}-${RUN_ATTEMPT}.json"
